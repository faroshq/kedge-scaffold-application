name: Build

# Smoke-tests both tiers, then builds and pushes one Railpack image per
# component — the same builder App Studio uses for user projects, so a green
# build here proves the scaffold is buildable exactly the way real projects
# are built. Pushes happen on main (latest + sha-<commit>) and on v* tags
# (<tag> + latest); PRs run the smoke tests only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: API — install, start, probe
        shell: bash
        run: |
          cd api
          npm install --no-audit --no-fund
          PORT=8081 DATABASE_URL=postgres://appuser:pw@localhost:5432/appdb npm start &
          # /api/health is a platform contract (AGENTS.md) — every project
          # keeps it, so it is the one endpoint CI may assert. Do NOT probe
          # the demo endpoints: projects replace them on their first change.
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null localhost:8081/api/health && exit 0
            sleep 1
          done
          exit 1

      - name: Web — install, build, serve, probe
        shell: bash
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
          PORT=8090 npm start &
          # Structural probe only: the tier must boot and serve a page.
          # NEVER assert page content here. Projects seeded from this scaffold
          # replace the page immediately, so a content check (it used to grep
          # for "kedge") turns every real change into a red build.
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null localhost:8090/ && exit 0
            sleep 1
          done
          exit 1

  build:
    name: Build ${{ matrix.component }} image with Railpack
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: "web"
          - component: api
            context: "api"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image coordinates
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with Railpack
        uses: iloveitaly/github-action-railpack@167ed71230addc378f3fb13122046c09f71c0e5f
        with:
          context: ${{ matrix.context }}
          # Multi-arch so the images also run on arm64 clusters (Apple Silicon
          # kind/tilt dev environments); arm64 builds run under QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          cache: true
          cache_tag: ${{ steps.image.outputs.name }}:buildcache
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
